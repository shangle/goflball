name = "goflball"
main = "worker.js"
compatibility_date = "2025-02-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
LAPTOP_TUNNEL_URL = "https://laptop-origin.goflball.com"
GITHUB_PAGES_MIRROR_URL = "https://shangle.github.io/goflball"
GITHUB_REPO = "shangle/goflball"

[ai]
binding = "AI"

# Uncomment after running: npx wrangler d1 create goflball-db
# [[d1_databases]]
# binding = "DB"
# database_name = "goflball-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
